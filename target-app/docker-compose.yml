version: '3.8'

services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    networks:
      - test-net
    cap_add:
      - NET_ADMIN
    privileged: true

  auth-service:
    build: ./auth-service
    ports:
      - "8001:8001"
    networks:
      - test-net
    cap_add:
      - NET_ADMIN
    privileged: true

  data-service:
    build: ./data-service
    ports:
      - "8002:8002"
    networks:
      - test-net
    cap_add:
      - NET_ADMIN
    privileged: true

  orders-service:
    build: ./orders-service
    ports:
      - "8003:8003"
    networks:
      - test-net
    cap_add:
      - NET_ADMIN
    privileged: true

  prometheus:
    image: prom/prometheus
    # No bind-mounts: host Docker daemon resolves paths from host FS,
    # not from inside the Jenkins container, so file mounts break in CI.
    # Prometheus starts with its built-in default config (still reachable at :9090).
    ports:
      - "9090:9090"
    networks:
      - test-net

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    networks:
      - test-net
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    # No bind-mounts for same reason as prometheus above.

networks:
  test-net:
    driver: bridge
